
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マウスピース装着記録</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f1f6f6;color:#173a40;margin:0}
main{max-width:750px;margin:auto;padding:16px}
h1{font-size:24px}h2{font-size:19px}
.card{background:white;border-radius:17px;padding:20px;margin:14px 0;border:1px solid #dbe8e8}
button{background:#116e75;color:white;border:0;padding:13px 16px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.primary{width:100%;padding:20px;font-size:21px}
.secondary{background:#e6eeee;color:#24575c}
.danger{background:#b74740}
input{padding:12px;border:1px solid #ccd8d8;border-radius:8px;width:100%;font-size:16px;margin:5px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:#eff5f5;padding:14px;border-radius:12px}
.metric b{display:block;font-size:23px;margin-top:8px}
.big{font-size:32px;font-weight:800;margin:12px 0}
.muted{color:#647e82;font-size:13px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.item{border-top:1px solid #ddd;padding:12px 0}
.item button{padding:8px;margin:3px}
#error{color:#b53a35}
#status{color:#127379}
</style>
</head>
<body>
<main>
<h1>🦷 マウスピース装着記録</h1>
<p class="muted">Firebaseクラウド同期・夫婦共有</p>

<section id="login" class="card">
<h2>ログイン</h2>
<input id="email" type="email" placeholder="メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<button id="loginBtn">ログイン</button>
<p id="loginError"></p>
</section>

<div id="app" hidden>
<section class="card">
<div class="row">
<span id="account"></span>
<button id="logout" class="secondary">ログアウト</button>
</div>
<p id="status">接続中...</p>
<p id="error"></p>
</section>

<section class="card">
<p class="muted">現在の状態</p>
<div id="current" class="big">確認中</div>
<p id="started" class="muted"></p>
<p class="muted">今回の装着時間</p>
<div id="timer" class="big">00:00:00</div>
<button id="toggle" class="primary" disabled>読み込み中</button>
</section>

<section class="card">
<h2>合計装着時間</h2>
<div class="grid">
<div class="metric">今日<b id="today">0h 00m</b></div>
<div class="metric">今週<b id="week">0h 00m</b></div>
<div class="metric">今月<b id="month">0h 00m</b></div>
<div class="metric">今年<b id="year">0h 00m</b></div>
</div>
</section>

<section class="card">
<h2>手入力・記録の修正</h2>
<label>装着開始日時</label>
<input id="start" type="datetime-local">
<label>取り外し日時</label>
<input id="end" type="datetime-local">
<div class="row">
<button id="save" disabled>記録を追加</button>
<button id="cancel" class="secondary" hidden>キャンセル</button>
</div>
</section>

<section class="card">
<h2>期間別集計</h2>
<div class="row">
<button class="secondary" id="daily">日別</button>
<button class="secondary" id="weekly">週別</button>
<button class="secondary" id="monthly">月別</button>
<button class="secondary" id="yearly">年別</button>
</div>
<div id="summary"></div>
</section>

<section class="card">
<h2>装着履歴</h2>
<div id="history"></div>
</section>

<section class="card">
<h2>バックアップ</h2>
<button id="backup" class="secondary">JSONを保存</button>
<button id="csv" class="secondary">Excel用CSVを保存</button>
<p class="muted">記録はFirestoreに保存されます。定期的にバックアップしてください。</p>
</section>
</div>
</main>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,onSnapshot,runTransaction} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const config={
 apiKey:"AIzaSyCtzWIi2bu-vc7YARYEMsf6tlCddhL_krk",
 authDomain:"aligner-tracker-73076.firebaseapp.com",
 projectId:"aligner-tracker-73076",
 storageBucket:"aligner-tracker-73076.firebasestorage.app",
 messagingSenderId:"437212561255",
 appId:"1:437212561255:web:6b60b80c486f403fcc39c2"
};

const firebase=initializeApp(config);
const auth=getAuth(firebase);
const db=getFirestore(firebase);
const shared=doc(db,"aligner","shared");
const el=id=>document.getElementById(id);

let data={active:null,entries:[]};
let ready=false,busy=false,editing=null,unsub=null;
let view="day";

function dateKey(ms){
 return new Intl.DateTimeFormat("en-CA",{
  timeZone:"Asia/Tokyo",year:"numeric",
  month:"2-digit",day:"2-digit"
 }).format(new Date(ms)).replaceAll("/","-");
}
function midnight(key){
 const [y,m,d]=key.split("-").map(Number);
 return Date.UTC(y,m-1,d)-9*3600000;
}
function dateText(ms){
 return new Date(ms).toLocaleString("ja-JP",{
  timeZone:"Asia/Tokyo",hour12:false
 });
}
function inputText(ms){
 const date=new Date(ms+9*3600000);
 return date.toISOString().slice(0,16);
}
function parseInput(value){
 return Date.parse(value+":00+09:00");
}
function duration(ms){
 const minutes=Math.floor(Math.max(0,ms)/60000);
 return Math.floor(minutes/60)+"h "+
 String(minutes%60).padStart(2,"0")+"m";
}
function periods(){
 const now=Date.now(),key=dateKey(now);
 const start=midnight(key);
 const [y,m]=key.split("-").map(Number);
 const weekday=(new Date(start).getUTCDay()+6)%7;
 return {
  today:[start,start+86400000],
  week:[start-weekday*86400000,start+(7-weekday)*86400000],
  month:[Date.UTC(y,m-1,1)-32400000,Date.UTC(y,m,1)-32400000],
  year:[Date.UTC(y,0,1)-32400000,Date.UTC(y+1,0,1)-32400000]
 };
}
function allIntervals(){
 const result=data.entries.map(x=>[x.start,x.end]);
 if(Number.isFinite(data.active))
  result.push([data.active,Date.now()]);
 return result;
}
function total(a,b){
 const intervals=allIntervals()
  .map(([s,e])=>[Math.max(a,s),Math.min(b,e)])
  .filter(([s,e])=>e>s)
  .sort((x,y)=>x[0]-y[0]);
 let sum=0,last=a;
 for(const [s,e] of intervals){
  sum+=Math.max(0,e-Math.max(last,s));
  last=Math.max(last,e);
 }
 return sum;
}
function render(){
 const p=periods();
 const active=Number.isFinite(data.active);
 el("current").textContent=active?"装着中":"取り外し中";
 el("started").textContent=active?
  dateText(data.active)+" から装着中":"未装着";
 let sec=active?Math.max(0,Math.floor((Date.now()-data.active)/1000)):0;
 el("timer").textContent=
  [Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60]
  .map(x=>String(x).padStart(2,"0")).join(":");
 el("toggle").textContent=active?"取り外しを記録":"装着開始を記録";
 el("toggle").className="primary"+(active?" danger":"");
 el("toggle").disabled=!ready||busy;
 el("save").disabled=!ready||busy;
 for(const key of Object.keys(p))
  el(key).textContent=duration(total(...p[key]));
 showSummary();
 el("history").replaceChildren();
 const entries=[...data.entries].sort((a,b)=>b.start-a.start);
 for(const entry of entries){
  const div=document.createElement("div");
  div.className="item";
  const label=document.createElement("div");
  label.textContent=dateText(entry.start)+" ～ "+
   dateText(entry.end)+" / "+duration(entry.end-entry.start);
  const edit=document.createElement("button");
  edit.className="secondary";edit.textContent="編集";
  edit.onclick=()=>{
   editing=entry.id;
   el("start").value=inputText(entry.start);
   el("end").value=inputText(entry.end);
   el("save").textContent="変更を保存";
   el("cancel").hidden=false;
   el("start").scrollIntoView({behavior:"smooth"});
  };
  const del=document.createElement("button");
  del.className="danger";del.textContent="削除";
  del.onclick=()=>{
   if(confirm("この履歴を削除しますか？"))
    update(s=>{s.entries=s.entries.filter(x=>x.id!==entry.id)});
  };
  div.append(label,edit,del);
  el("history").append(div);
 }
}
function showSummary(){
 const p=periods(),now=Date.now(),today=midnight(dateKey(now));
 let rows=[];
 if(view==="day"){
  for(let i=6;i>=0;i--){
   const a=today-i*86400000;
   rows.push([dateKey(a),a,a+86400000]);
  }
 }else if(view==="week"){
  const a=p.week[0];
  for(let i=7;i>=0;i--){
   const b=a-i*7*86400000;
   rows.push([dateKey(b)+"週",b,b+7*86400000]);
  }
 }else if(view==="month"){
  const [y,m]=dateKey(now).split("-").map(Number);
  for(let i=11;i>=0;i--){
   const a=Date.UTC(y,m-1-i,1)-32400000;
   const b=Date.UTC(y,m-i,1)-32400000;
   rows.push([dateKey(a).slice(0,7),a,b]);
  }
 }else{
  const y=Number(dateKey(now).slice(0,4));
  for(let i=7;i>=0;i--){
   const a=Date.UTC(y-i,0,1)-32400000;
   const b=Date.UTC(y-i+1,0,1)-32400000;
   rows.push([String(y-i)+"年",a,b]);
  }
 }
 el("summary").replaceChildren();
 for(const [name,a,b] of rows){
  const div=document.createElement("div");
  div.className="item";
  div.textContent=name+"： "+duration(total(a,b));
  el("summary").append(div);
 }
}
async function update(change){
 if(!ready||busy)return false;
 busy=true;el("status").textContent="保存中...";
 el("error").textContent="";
 render();
 try{
  await runTransaction(db,async tx=>{
   const snapshot=await tx.get(shared);
   const old=snapshot.exists()?snapshot.data():{};
   const next={
    active:Number.isFinite(old.active)?old.active:null,
    entries:Array.isArray(old.entries)?old.entries:[]
   };
   change(next);
   tx.set(shared,next);
  });
  el("status").textContent="保存完了";
  return true;
 }catch(e){
  el("error").textContent="保存エラー: "+(e.code||e.message);
  el("status").textContent="保存できませんでした";
  return false;
 }finally{busy=false;render()}
}
el("toggle").onclick=()=>update(s=>{
 const now=Date.now();
 if(Number.isFinite(s.active)){
  if(now>s.active)
   s.entries.push({id:crypto.randomUUID(),start:s.active,end:now});
  s.active=null;
 }else{s.active=now}
});
el("save").onclick=async()=>{
 const a=parseInput(el("start").value);
 const b=parseInput(el("end").value);
 if(!Number.isFinite(a)||!Number.isFinite(b)||a>=b||b>Date.now()){
  alert("開始・終了日時を確認してください");return;
 }
 const id=editing;
 const ok=await update(s=>{
  if(id){
   const target=s.entries.find(x=>x.id===id);
   if(!target)throw Error("記録が見つかりません");
   target.start=a;target.end=b;
  }else{
   s.entries.push({id:crypto.randomUUID(),start:a,end:b});
  }
 });
 if(ok){
  editing=null;el("start").value="";el("end").value="";
  el("save").textContent="記録を追加";
  el("cancel").hidden=true;
 }
};
el("cancel").onclick=()=>{
 editing=null;el("start").value="";el("end").value="";
 el("save").textContent="記録を追加";
 el("cancel").hidden=true;
};
for(const [id,value] of [
 ["daily","day"],["weekly","week"],
 ["monthly","month"],["yearly","year"]
]){
 el(id).onclick=()=>{view=value;showSummary()};
}
el("loginBtn").onclick=async()=>{
 el("loginError").textContent="";
 try{
  await signInWithEmailAndPassword(
   auth,el("email").value,el("password").value
  );
  el("password").value="";
 }catch(e){
  el("loginError").textContent="ログイン失敗: "+e.code;
 }
};
el("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
 if(unsub){unsub();unsub=null}
 ready=false;data={active:null,entries:[]};
 el("login").hidden=!!user;el("app").hidden=!user;
 if(!user)return;
 el("account").textContent=user.email;
 unsub=onSnapshot(shared,snap=>{
  const value=snap.exists()?snap.data():{};
  data={
   active:Number.isFinite(value.active)?value.active:null,
   entries:Array.isArray(value.entries)?value.entries:[]
  };
  ready=true;
  el("status").textContent="同期済み";
  el("error").textContent="";
  render();
 },e=>{
  ready=false;
  el("error").textContent="同期エラー: "+e.code;
  el("status").textContent="同期できません";
  render();
 });
});
function download(name,text,type){
 const url=URL.createObjectURL(new Blob([text],{type}));
 const a=document.createElement("a");
 a.href=url;a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
}
el("backup").onclick=()=>download(
 "aligner_backup.json",JSON.stringify(data,null,2),"application/json"
);
el("csv").onclick=()=>{
 const lines=["装着開始,取り外し,装着分数"];
 for(const x of data.entries)
  lines.push([dateText(x.start),dateText(x.end),
   Math.round((x.end-x.start)/60000)].join(","));
 download("aligner_records.csv","\ufeff"+lines.join("\r\n"),"text/csv");
};
setInterval(()=>{if(ready)render()},1000);
</script>
</body>
</html>
